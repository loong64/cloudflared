name: build(cloudflared)

on:
  workflow_dispatch:
    inputs:
      version:
        default: 'latest'
        description: 'Package version'
        type: string
        required: true

  schedule:
    - cron: '0 20 * * *'

env:
  app_name: 'cloudflared'
  app_repo: 'cloudflare/cloudflared'

jobs:
  check:
    runs-on: ubuntu-slim
    outputs:
      app_version: ${{ steps.get-version.outputs.app_version }}
      app_build: ${{ steps.check-release.outputs.app_build }}
    steps:
      - uses: actions/checkout@v7

      - name: Get Version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.version }}" = "latest" ]; then
            app_version=$(curl -s "https://api.github.com/repos/${{ env.app_repo }}/releases/latest" | jq -r .tag_name)
          else
            app_version=${{ github.event.inputs.version }}
          fi
          if [ -z "${app_version}" ] || [ "${app_version}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi
          
          echo "app_version=${app_version}" >> $GITHUB_ENV
          echo "app_version=${app_version}" >> $GITHUB_OUTPUT
          echo ""
          echo "========== Build Args =========="
          echo "app_version=${app_version}"

      - name: Check Release
        id: check-release
        run: |
          gh release view ${app_version} -R ${{ github.repository }} | grep ${{ env.app_name }}-.*-linux-loong64 >/dev/null 2>&1 || echo "app_build=1" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    if: needs.check.outputs.app_build == '1'
    runs-on: ubuntu-latest
    needs: check
    env:
      app_version: ${{ needs.check.outputs.app_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.app_repo }}
          ref: ${{ env.app_version }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build cloudflared
        run: |
          # https://github.com/cloudflare/cloudflared/blob/master/.ci/scripts/linux/build-packages.sh
          VERSION=$(git describe --tags --always --match "[0-9][0-9][0-9][0-9].*.*")
          DATE=$(date -u -r RELEASE_NOTES '+%Y-%m-%d-%H:%M UTC')
          echo "$VERSION"
          export CGO_ENABLED=0
          export ARTIFACT_DIR=artifacts
          mkdir -p "$ARTIFACT_DIR"
          for arch in amd64 arm64 loong64 ppc64le riscv64 s390x; do
            GOOS=linux GOARCH=${arch} go build -mod=readonly \
              -ldflags="-X \"main.Version=${VERSION}\" -X \"main.BuildTime=${DATE}\"" \
              -o "${ARTIFACT_DIR}/cloudflared-linux-${arch}" \
              github.com/cloudflare/cloudflared/cmd/cloudflared
          done

          export FIPS=true
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=${arch} go build -mod=readonly \
              -ldflags="-X \"main.Version=${VERSION}\" -X \"main.BuildTime=${DATE}\" -X \"main.BuildType=FIPS\"" \
              -o "${ARTIFACT_DIR}/cloudflared-fips-linux-${arch}" \
              github.com/cloudflare/cloudflared/cmd/cloudflared
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cloudflared-linux
          path: artifacts

  release:
    if: needs.check.outputs.app_build == '1'
    runs-on: ubuntu-slim
    needs:
      - check
      - build
    env:
      app_version: ${{ needs.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release
        uses: actions/download-artifact@v8
        with:
          pattern: cloudflared-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ env.app_version }}"
          gh release create "${TAG_NAME}" \
            --generate-notes \
            --title "${TAG_NAME}" \
            dist/*
